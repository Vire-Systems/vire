name: Continuous Integration

on:
  push:
    branches:
      - staging
      - main
  pull_request:
    branches:
      - main
      - staging

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv sync --extra dev

      - name: Run Pytest
        run: |
          uv run pytest \
            --cov=. \
            --cov-report=term-missing \ 
            --cov-fail-under=80 \
            --tb=short \ 
            -v tests/
